version: '3.8'

services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ieee_paper_backend_dev
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "true"
      APP_NAME: "IEEE Paper Generator (Dev)"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: uploads
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200
      TOP_K_RESULTS: 5
      MAX_TOKENS: 2000
      TEMPERATURE: 0.7
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
    volumes:
      - ./backend:/app
      - backend_dev_uploads:/app/uploads
      - backend_dev_models:/root/.cache/torch
    ports:
      - "8001:8000"
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - ieee_dev_network

  frontend-dev:
    image: node:18-alpine
    container_name: ieee_paper_frontend_dev
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_APP_NAME: "IEEE Paper Generator (Dev)"
      VITE_MAX_FILE_SIZE: 10485760
      VITE_ALLOWED_FILE_TYPES: ".pdf,.docx"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - ieee_dev_network

volumes:
  backend_dev_uploads:
    driver: local
  backend_dev_models:
    driver: local

networks:
  ieee_dev_network:
    driver: bridge
