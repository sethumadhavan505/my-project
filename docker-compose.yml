version: '3.8'

services:
  # Uses the hosted Supabase project configured in backend/.env.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ieee_paper_backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: ${DEBUG:-false}
      APP_NAME: "IEEE Paper Generator"
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: uploads
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200
      TOP_K_RESULTS: 5
      MAX_TOKENS: 2000
      TEMPERATURE: 0.7
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
    volumes:
      - backend_uploads:/app/uploads
      - backend_models:/root/.cache/torch
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ieee_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ieee_paper_frontend
    environment:
      # Browser requests use the backend port published on this host.
      VITE_API_BASE_URL: http://localhost:8000
      VITE_APP_NAME: "IEEE Paper Generator"
      VITE_MAX_FILE_SIZE: 10485760
      VITE_ALLOWED_FILE_TYPES: ".pdf,.docx"
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ieee_network

volumes:
  backend_uploads:
    driver: local
  backend_models:
    driver: local

networks:
  ieee_network:
    driver: bridge
